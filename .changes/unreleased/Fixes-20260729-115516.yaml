kind: Fixes
body: 'dbt retry now treats a warn node as retryable only when the retry invocation passes --warn-error, matching dbt-core. Previously retry always re-ran warned nodes, so a severity: warn test that kept warning was re-run on every retry and --warn-error had no effect. The ''Retrying N nodes'' banner also no longer describes retried nodes as failed.'
