kind: Fixes
body: Honor a `null` config in the dbt_project.yml models hierarchy so it clears a
  value inherited from a higher level (starting with `hours_to_expiration`), and
  ensure a more-specific level's value always overrides a cleared parent, matching
  dbt Core precedence
