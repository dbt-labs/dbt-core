kind: Fixes
body: Fix `timedelta.total_seconds()` truncating to whole seconds, so sub-second durations no longer return `0.0`. Also makes non-zero sub-second timedeltas truthy and normalizes `days`/`seconds`/`microseconds` and `str()` for negative durations, matching Python.
