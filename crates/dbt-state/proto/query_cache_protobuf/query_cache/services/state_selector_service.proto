syntax = "proto3";

package com.fivetran.query_cache;

import "query_cache_protobuf/query_cache/shared.proto";

service StateSelectorService {
    rpc GetStateSelection(StateSelectorRequest) returns (StateSelectorResponse);
}

message StateSelectorRequest {
    string target = 1;
    optional string project_id = 2;
    optional string project_name = 3;
    repeated DbtNodeState nodes = 4;
    SelectorCriteria selector_criteria = 5;
}

enum SelectorCriteria {
    SC_UNSPECIFIED = 0;
    MODIFIED = 1;
    NEW = 2;
    UNMODIFIED = 3;
    OLD = 4;
    BODY = 5;
    CONFIGS = 6;
    RELATION = 7;
    PERSISTED_DESCRIPTIONS = 8;
    MACROS = 9;
    CONTRACT = 10;
}

message StateSelectorResponse {
    repeated string modified_ids = 1; // contains results for all criteria except NEW, UNMODIFIED, OLD
    repeated string new_ids = 2;
    repeated string unmodified_ids = 3;
    repeated string old_ids = 4;
}

